<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS -->
    <link href="assets/css/output.css" rel="stylesheet">
    <title>SPS Global Recruitment | Vacancies</title>
</head>

<body class="bg-spspurple">
    <header class="bg-spspurple px-6 py-4 flex items-center justify-between relative">
        <!-- Logo -->
        <div class="flex flex-col flex-shrink-0 items-start w-48">
            <img src="assets/images/logo_temp.webp" alt="SPS Global Recruitment Logo" class="w-40 h-auto">
        </div>
        <!-- Desktop Nav and buttons that will be hidden on mobile devices -->
        <div class="hidden lg:flex flex-1 items-center justify-end space-x-4">
            <nav class="flex-1 flex space-x-8">
                <a href="index.html"
                    class="text-spswhite text-2xl tracking-wide font-sourcesans3 decoration-spswhite">HOME</a>
                <a href="about.html" class="text-spswhite text-2xl font-sourcesans3 tracking-wide">ABOUT</a>
            </nav>
            <!-- Buttons -->
            <div class="flex space-x-4">
                <a href="vacancies.html"
                    class="bg-spswhite px-8 py-3 font-bold text-lg text-spsdark font-sourcesans3">VACANCIES</a>
                <a href="contact.html" class="bg-spswhite px-8 py-3 font-bold text-lg text-spsdark font-sourcesans3">GET
                    IN
                    TOUCH</a>
            </div>
        </div>

        <!-- Burger Icon for mobile devices -->
        <div class="lg:hidden">
            <button id="burger-button" class="text-spswhite">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M3 6C3 5.44772 3.44772 5 4 5H20C20.5523 5 21 5.44772 21 6C21 6.55228 20.5523 7 20 7H4C3.44772 7 3 6.55228 3 6ZM6 12C6 11.4477 6.44772 11 7 11H17C17.5523 11 18 11.4477 18 12C18 12.5523 17.5523 13 17 13H7C6.44772 13 6 12.5523 6 12ZM9 18C9 17.4477 9.44772 17 10 17H14C14.5523 17 15 17.4477 15 18C15 18.5523 14.5523 19 14 19H10C9.44772 19 9 18.5523 9 18Z" />
                </svg>
            </button>
        </div>

        <!-- Menu for Mobile (hidden on desktop) -->
        <div id="mobile-menu" class="hidden absolute z-12 top-full left-0 right-0 bg-spspurple">
            <nav class="flex flex-col items-center p-4 space-y-4">
                <a href="index.html" class="text-spswhite text-2xl font-sourcesans3">HOME</a>
                <a href="about.html" class="text-spswhite text-2xl font-sourcesans3">ABOUT</a>
                <a href="vacancies.html" class="text-spswhite text-2xl font-sourcesans3">VACANCIES</a>
                <a href="contact.html" class="text-spswhite text-2xl font-sourcesans3">GET IN TOUCH</a>
            </nav>
        </div>

    </header>
    <main>
        <!-- Search bar -->
        <section class="text-spsdark p-2 mb-10 xl:mb-0 xl:mt-0 mt-8">
            <div class="lg:grid lg:grid-cols-7 lg:justify-items-center border border-spsdark bg-spswhite border-2 p-3 shadow-xl shadow-spsdark">
                <div>
                    <label for="cars" class="grid lg:place-self-start place-self-center mb-1 font-sourcesans3 text-2xl">Sector:</label>

                    <select name="sector" id="sector" class="bg-spswhite border grid lg:place-self-start place-self-center border-spsdark text-xl">
                        <option value="executive">Executive</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div>
                    <label for="job-title" class="grid lg:place-self-start place-self-center mb-1 font-sourcesans3 text-2xl">Job Title</label>

                    <select name="job-title" id="job-title" class="grid lg:place-self-start place-self-center bg-spswhite border border-spsdark text-xl">
                        <option value="">Job 1</option>
                        <option value="">Job 2</option>
                        <option value="">Job 3</option>
                        <option value="">Job 4</option>
                        <option value="">Job 5</option>
                        <option value="">Job 6</option>
                        <option value="">Job 7</option>
                        <option value="">Job 8</option>
                        <option value="">Job 9</option>
                        <option value="">Job 10</option>
                    </select>
                </div>
                <div>
                    <label for="location" class="grid lg:place-self-start place-self-center mb-1 font-sourcesans3 text-2xl">Location:</label>

                    <select name="location" id="location" class="grid lg:place-self-start place-self-center bg-spswhite border border-spsdark text-xl">
                        <option value="">Location 1</option>
                        <option value="">Location 2</option>
                        <option value="">Location 3</option>
                        <option value="">Location 4</option>
                        <option value="">Location 5</option>
                        <option value="">Location 6</option>
                        <option value="">Location 7</option>
                        <option value="">Location 8</option>
                        <option value="">Location 9</option>
                        <option value="">Location 10</option>
                    </select>
                </div>
                <div>
                    <label for="part-time-full-time" class="grid lg:place-self-start place-self-center mb-2 font-sourcesans3 text-xl">Part
                        Time/Full Time:</label>

                    <select name="part-time-full-time" id="part-time-full-time"
                        class="grid lg:place-self-start place-self-center bg-spswhite border border-spsdark text-xl">
                        <option value="part-time">Part Time</option>
                        <option value="full-time">Full Time</option>
                    </select>
                </div>
                <div> <label for="salary" class="grid lg:place-self-start place-self-center lg:mb-1 mb-0 font-sourcesans3 text-2xl">Salary:</label>

                    <select name="salary" id="salary" class="grid lg:place-self-start place-self-center bg-spswhite border border-spsdark text-xl">
                        <option value="">Salary 1</option>
                        <option value="">Salary 2</option>
                        <option value="">Salary 3</option>
                        <option value="">Salary 4</option>
                        <option value="">Salary 5</option>
                        <option value="">Salary 6</option>
                        <option value="">Salary 7</option>
                        <option value="">Salary 8</option>
                        <option value="">Salary 9</option>
                        <option value="">Salary 10</option>
                    </select>
                </div>
                <div>
                    <label for="cars" class="grid lg:place-self-start place-self-center mb-1 font-sourcesans3 text-2xl">Keyword:</label>
                    <input type="text" id="keyword" name="keyword" class="grid lg:place-self-start place-self-center border border-spsdark text-xl border-3">
                </div>
                <!-- Buttons -->
                <div class="grid place-self-center mt-6 lg:mt-0">
                        <a href="#"
                            class="whitespace-nowrap inline-block bg-spsdark px-4 py-2 font-bold text-lg text-spswhite text-center font-sourcesans3">Apply
                            Filters</a>
                    <!-- <div>
                        <a href="#" class="bg-spswhite px-2 py-1 font-bold text-lg text-spsdark font-sourcesans3">Reset
                            Filters</a>
                    </div> -->

                </div>

            </div>
        </section>
        <!-- Job Cards -->
        <section class="text-spsdark lg:p-16 p-2 lg:mb-0 mb-8 font-sourcesans3">
            <!-- Job Grid -->
            <div id="jobs-grid-container" class="lg:grid lg:grid-cols-2 lg:gap-12 grid grid-row gap-6">
                    <!-- Jobs will be inserted here by JavaScript. It all comes from the backend set up using the Django REST Framework -->
            </div>
        </section>
    </main>


    <footer class="bg-spspurple md:py-40 py-20 px-6 lg:px-12 text-center lg:text-start relative">
        <div class="container mx-auto flex flex-wrap">
            <!--  Col 1 Logo -->
            <div class="w-full lg:w-1/4 mb-8 lg:mb-0 lg:px-0 px-20 md:px-60">
                <img src="assets/images/logo_temp.webp" alt="SPS Global Recruitment Logo" class="w-60 h-60">
            </div>
            <!-- Col 2 Address/Contact -->
            <div class="w-full lg:w-1/4 text-spswhite text-lg font-sourcesans3">
                <div class="font-bold mb-3">SIMPLY ANEGLIC LTD</div>
                <div>3rd Floor <br>
                    45 Albemarle Street<br>
                    Mayfair<br>
                    London, W1S 4JL
                </div>
                <div class="mt-8">Phone:<a href="tel:+447822012494"> +44 7822012494</a></div>
                <div class="lg:mb-0 mb-8">Email:<a href="mailto:london@spsglobal.com"> london@spsglobal.com</a></div>
            </div>
            <!-- Col 3 Quick Links -->
            <div class="w-full lg:w-1/4 mb-8 lg:mb-0 text-spswhite text-lg">
                <div class="font-playfairdisplay font-bold text-xl mb-3">Quick Links</div>
                <ul class="font-sourcesans3 space-y-2">
                    <li><a href="index.html" class="hover:underline">Home</a></li>
                    <li><a href="vacancies.html" class="hover:underline">Vacancies</a></li>
                    <li><a href="about.html" class="hover:underline">About</a></li>
                    <li><a href="contact.html" class="hover:underline">Get in touch</a></li>
                </ul>
            </div>
            <!-- Col 4 Socials -->
            <div class="w-full lg:w-1/4 mb-8 lg:mb-0 text-spswhite text-lg">
                <div class="font-playfairdisplay font-bold text-xl">Socials</div>
                <!-- Custom icons will go here -->
            </div>
        </div>


    </footer>
    <!-- Mobile Menu JS -->
    <script src="assets/js/menu.js"></script>
    <!-- Vacancies JS (Using APIs) -->
    <script src="assets/js/vacancies.js"></script>
</body>

</html>
