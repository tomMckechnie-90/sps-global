<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS -->
    <link href="assets/css/output.css" rel="stylesheet">
    <title>SPS Global Recruitment | Vacancies</title>
</head>

<body class="bg-spspurple">
    <header class="bg-spspurple px-6 py-4 flex items-center justify-between relative">
        <!-- Logo -->
        <div class="flex flex-col flex-shrink-0 items-start w-48">
            <img src="assets/images/logo's/1.svg" alt="SPS Global Recruitment Logo" class="w-40 h-auto">
        </div>
        <!-- Desktop Nav and buttons that will be hidden on mobile devices -->
        <div class="hidden lg:flex flex-1 items-center justify-end space-x-4">
            <nav class="flex-1 flex space-x-8">
                <a href="index.html"
                    class="text-spswhite text-2xl tracking-wide font-sourcesans3 decoration-spswhite transition-all duration-300 ease-in-out hover:-translate-y-1 hover:text-spshover">HOME</a>
                <a href="about.html"
                    class="text-spswhite text-2xl font-sourcesans3 tracking-wide transition-all duration-300 ease-in-out hover:-translate-y-1 hover:text-spshover">ABOUT</a>
            </nav>
            <!-- Buttons -->
            <div class="flex space-x-4">
                <a href="vacancies.html"
                    class="bg-spswhite px-8 py-3 font-bold text-lg text-spsdark font-sourcesans3 shadow-sm shadow-black/15 hover:shadow-lg hover:bg-spshover transition-all duration-300 ease-in-out hover:-translate-y-1">VACANCIES</a>
                <a href="contact.html"
                    class="bg-spswhite px-8 py-3 font-bold text-lg text-spsdark font-sourcesans3 shadow-sm shadow-black/15 hover:shadow-lg hover:bg-spshover transition-all duration-300 ease-in-out hover:-translate-y-1">GET
                    IN
                    TOUCH</a>
            </div>
        </div>

        <!-- Burger Icon for mobile devices -->
        <div class="lg:hidden">
            <button id="burger-button" class="text-spswhite">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M3 6C3 5.44772 3.44772 5 4 5H20C20.5523 5 21 5.44772 21 6C21 6.55228 20.5523 7 20 7H4C3.44772 7 3 6.55228 3 6ZM6 12C6 11.4477 6.44772 11 7 11H17C17.5523 11 18 11.4477 18 12C18 12.5523 17.5523 13 17 13H7C6.44772 13 6 12.5523 6 12ZM9 18C9 17.4477 9.44772 17 10 17H14C14.5523 17 15 17.4477 15 18C15 18.5523 14.5523 19 14 19H10C9.44772 19 9 18.5523 9 18Z" />
                </svg>
            </button>
        </div>

        <!-- Menu for Mobile (hidden on desktop) -->
        <div id="mobile-menu"
            class="absolute z-12 top-full left-0 right-0 bg-spspurple overflow-hidden transition-all duration-500 ease-in-out max-h-0 opacity-0">
            <nav class="flex flex-col items-center p-4 space-y-4">
                <a href="index.html" class="text-spswhite text-2xl font-sourcesans3">HOME</a>
                <a href="about.html" class="text-spswhite text-2xl font-sourcesans3">ABOUT</a>
                <a href="vacancies.html" class="text-spswhite text-2xl font-sourcesans3">VACANCIES</a>
                <a href="contact.html" class="text-spswhite text-2xl font-sourcesans3">GET IN TOUCH</a>
            </nav>
        </div>

    </header>
    <main>
        <!-- TAB CONTAINER -->
        <div class="flex justify-center mb-8">

            <!-- Button 1: Private Staff (This one starts turned ON/Gold) -->
            <button id="tab-private"
                class="w-1/2 md:w-auto px-8 py-4 font-playfairdisplay font-bold text-xl md:text-2xl border-2 border-spsdark bg-spsaccent text-spswhite hover:cursor-pointer transition-colors duration-300">
                Private Household
            </button>

            <!-- Button 2: Executive Search (This one starts turned OFF/White) -->
            <button id="tab-executive"
                class="w-1/2 md:w-auto px-8 py-4 font-playfairdisplay font-bold text-xl md:text-2xl border-2 border-spsdark smokey-bg text-white hover:cursor-pointer transition-colors duration-300">
                Executive Search
            </button>

        </div>
        <section class="text-spsaccent p-2 mb-10 xl:mb-0 xl:mt-0 mt-8">
            <!-- FILTER BAR -->
            <div
                class="lg:grid lg:grid-cols-5 lg:justify-items-center border border-spsdark smokey-bg border-2 p-3 shadow-sm shadow-black/15 gap-4">

                <!-- 1. LOCATION FILTER -->
                <div class="w-full">
                    <label for="location" class="block mb-1 font-sourcesans3 text-xl font-bold">Location:</label>
                    <select id="filter-location" class="w-full bg-spspurple border border-spsdark text-lg text-spswhite p-2">
                        <option value="">All Locations</option>
                        <!-- JavaScript will insert real locations here later -->
                    </select>
                </div>

                <!-- 2. JOB ROLE FILTER -->
                <div class="w-full">
                    <label for="role" class="block mb-1 font-sourcesans3 text-xl font-bold">Job Role:</label>
                    <select id="filter-role" class="w-full bg-spspurple border border-spsdark text-lg text-spswhite p-2">
                        <option value="">All Roles</option>
                        <!-- JavaScript will insert real roles here later -->
                    </select>
                </div>

                <!-- 3. JOB TYPE FILTER -->
                <div class="w-full">
                    <label for="type" class="block mb-1 font-sourcesans3 text-xl font-bold">Type:</label>
                    <select id="filter-type" class="w-full bg-spspurple border border-spsdark text-spswhite text-lg p-2">
                        <option value="" class="bg-spspurple">Any Type</option>
                        <option value="Full Time" class="bg-spspurple">Full Time</option>
                        <option value="Part Time" class="bg-spspurple">Part Time</option>
                        <option value="Temporary" class="bg-spspurple">Temporary</option>
                    </select>
                </div>

                <!-- 4. KEYWORD SEARCH -->
                <div class="w-full lg:mb-0 mb-8">
                    <label for="keyword" class="block mb-1 font-sourcesans3 text-xl font-bold">Keyword:</label>
                    <input type="text" id="filter-keyword" placeholder="Search..."
                        class="w-full border border-spsdark text-lg p-2 text-spswhite">
                </div>

                <!-- 5. ACTION BUTTONS -->
                <div class="w-full flex items-end">
                    <button id="btn-filter"
                        class="w-full border-spsaccent border text-spswhite font-bold text-lg py-2 hover:bg-spsaccent hover:cursor-pointer transition-colors">
                        Update Results
                    </button>
                </div>

            </div>
        </section>
        <!-- Job Cards -->
        <section class="text-spsdark lg:p-16 p-2 lg:mb-0 mb-8 font-sourcesans3">
            <!-- Job Grid -->
            <div id="jobs-grid-container" class="lg:grid lg:grid-cols-2 lg:gap-12 grid grid-row gap-6">
                <!-- Jobs will be inserted here by JavaScript. It all comes from the backend set up using the Django REST Framework -->
            </div>
        </section>
    </main>


    <footer class="bg-spspurple md:py-40 py-20 px-6 lg:px-12 text-center lg:text-start">
        <div class="container mx-auto flex flex-wrap">
            <!--  Col 1 Logo -->
            <div class="w-full lg:w-1/4 mb-8 lg:mb-0 lg:px-0 px-20 md:px-60">
                <img src="assets/images/logo's/1.svg" alt="SPS Global Recruitment Logo" class="w-60 h-60">
            </div>
            <!-- Col 2 Address/Contact -->
            <div class="w-full lg:w-1/4 text-spswhite text-lg font-sourcesans3">
                <div class="font-bold mb-3">SIMPLY ANGELIC LTD</div>
                <div>3rd Floor <br>
                    45 Albemarle Street<br>
                    Mayfair<br>
                    London, W1S 4JL
                </div>
                <div class="mt-8">Phone:<a href="tel:+447822012494"> +44 7822012494</a></div>
                <div class="lg:mb-0 mb-8">Email:<a href="mailto:london@spsglobal.com"> london@spsglobal.com</a></div>
            </div>
            <!-- Col 3 Quick Links -->
            <div class="w-full lg:w-1/4 mb-8 lg:mb-0 text-spswhite text-lg">
                <div class="font-playfairdisplay font-bold text-xl mb-3">Quick Links</div>
                <ul class="font-sourcesans3 space-y-2">
                    <li><a href="index.html" class="hover:underline">Home</a></li>
                    <li><a href="vacancies.html" class="hover:underline">Vacancies</a></li>
                    <li><a href="about.html" class="hover:underline">About</a></li>
                    <li><a href="#sectors" class="hover:underline">Sectors</a></li>
                    <li><a href="contact.html" class="hover:underline">Get in touch</a></li>
                </ul>
            </div>
            <!-- Col 4 Socials -->
            <div class="w-full lg:w-1/4 mb-8 lg:mb-0 text-spswhite text-lg">
                <div class="font-playfairdisplay font-bold text-xl">Socials</div>
                <!-- Custom icons will go here -->
            </div>
        </div>


    </footer>
    <!-- Mobile Menu JS -->
    <script src="assets/js/menu.js"></script>
    <!-- Vacancies JS (Using APIs) -->
    <script src="assets/js/vacancies.js"></script>
</body>

</html>
